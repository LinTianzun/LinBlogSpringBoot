# 本地开发样例（application-dev.yml）：`mvn spring-boot:run -Dspring-boot.run.profiles=dev`
# 生产环境不要使用此文件，全部走环境变量（见 .env.example）。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/springlinblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    # 口令不落仓库：backend/.env 写 DB_PASSWORD=你的本机密码（properties 语法，已 gitignore），
    # 缺省回退 root；也可用环境变量 DB_PASSWORD 覆盖。
    password: ${DB_PASSWORD:root}

app:
  jwt-access-secret: dev-only-secret-0123456789abcdef0123456789
  jwt-access-ttl: PT15M
  refresh-ttl-days: 7
  cookie-domain:
  cookie-secure: false
  # CORS：vite 代理不重写 Origin 头，浏览器请求到达后端仍带 dev 来源，
  # 故必须把 vite dev 实际端口（vite.config.ts server.port，当前 5730）列入。
  allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5730,http://127.0.0.1:5730
  public-url: http://localhost:5173
  storage-driver: local
  storage-local-dir: ./data/storage
  view-dedup-minutes: 30
  view-retention-days: 7
  audit-retention-days: 90
  trash-retention-days: 30
  geoip-enabled: false
  rate-limit-login: 5
  rate-limit-reset: 5
  smtp:
    host:
    port: 465
    secure: true
    user:
    pass:
    from:

logging:
  level:
    com.linblog: DEBUG
